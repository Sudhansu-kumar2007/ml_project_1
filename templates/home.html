<html>
    <body>
        <div class="login">
            <h1>Student Exam Performance Indicator</h1>
            <form action="{{url_for('predict_datapoint')}}" method="post">
                <h1>
                    <legend>Student Exam Performance prediction</legend>
                </h1>
                <div class="mb-3">
                    <label class="form-label">Gender</label>
                    <select name="gender" aria-placeholder="Enter your gender" class="form-control">
                        <option selected disabled value="" class="placeholder">select your gender</option>
                        <option value="male">Male</option>
                        <option value="female">Female</option>
                        
                    </select>
                </div>
                <div class="mb-3">



                </div>
                <div class="mb-3">
                    <label class="form-label">Race or Ethnicity</label>
                    <select name="ethnicity" placeholder="Enter your Ethnicity" id="" class="form-control" required>
                        <option value="" selected disabled class="placeholder">Select Ethnicity</option>
                        <option value="group A">Group A</option>
                        <option value="group B">Group B</option>
                        <option value="group C">Group C</option>
                        <option value="group D">Group D</option>
                    </select>
                </div>
                
                
                <div>
                    <label for="">Parental Level of Education</label>
                <select name="parental_level_of_education" id="">
                    <option value="associate's degree">
                        associate's degree
                    </option>
                    <option value="bachelor's degree">
                        bachelor's degree
                    </option>
                    <option value="high school">
                        high school
                    </option>
                    <option value="master's degree">
                        master's degree
                    </option>
                    <option value="some college">
                        some colege
                    </option>
                    <option value="some high school">
                        some high school
                    </option>
                    
                </select></div>
                <div class="mb-3">
                    <label  class="form-label">Lunch Type</label>
                    <select name="lunch" placeholder="Enter your Lunch"  class="form-control" required>
                        <option value="" class="placeholder">Select Lunch Type</option>
                        <option value="free/reduced">free/reduced</option>
                        <option value="standard">standard</option>
                    </select>
                </div>
                <div class="mb-3">
                    <label  class="form-label">Test Preparation Corse</label>
                    <select name="test_preparation_course" placeholder="Enter your course"  class="form-control" required>
                        <option value="" class="placeholder" selected disabled >Test Course</option>
                        <option value="none">None</option>
                        <option value="completed">Completed</option>
                    </select>
                </div>

                <div class="mb-3">
                    <label class="form-label">Reading Score out of 100</label>
                    <input class="form-control" type="number" name="reading_score" placeholder="Enter your Reading Score" min="0" max="100" />
                </div>
                <div class="mb-3">
                    <label class="form-label">Writing Score out of 100</label>
                    <input class="form-control" type="number" name="writing_score" placeholder="Enter your Writing Score" min="0" max="100" />
                </div>
                <div class="mb-3">
                    <input type="submit" class="btn btn-primary" value="Predict your Maths Score" required>
                </div>
            </form>
            <h2>
                The prediction is{{results}}
            </h2>
        </div>
    </body>
</html>
